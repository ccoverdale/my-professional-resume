name: Build And Push to ECR

on:
    push:
        # pull_requests:
        #  branches: [ 'main', 'dev']
        branches: [ 'main']
permissions:
    id-token: write
    contents: read

jobs:
    build_scan:
        runs-on: ubuntu-latest # the runner
        steps:
            - name: Checkout the Code
              uses: actions/checkout@v7 # downloads source code to the runner
            - name: Trivy Scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'fs'
                severity: HIGH,CRITICAL
                exit-code: 0

            - name: Build Docker Image
              run: docker build -t ${{secrets.ECR_REPO}}/my-repo:latest .
            - name: Scan image with Trivy
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{secrets.ECR_REPO}}/my-repo:latest
                format: table
                exit-code: 0
                ignore-unfixed: true
                severity: CRITICAL,HIGH

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4 # More information on this action can be found below in the 'AWS Credentials' section
              with:
                role-to-assume: ${{secrets.AWS_ROLE}}
                aws-region: us-east-1
            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Push Image to ecr
              run: docker push ${{secrets.ECR_REPO}}/my-repo:latest

    Deploy_to_ecs:
        needs: build_scan
        runs-on: ubuntu-latest
        steps:
            # 1. Download the code so the runner can see your infrastructure file
            - name: Checkout the Code
              uses: actions/checkout@v4 

            # 2. Authenticate with AWS
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{secrets.AWS_ROLE}}
                aws-region: us-east-1

            # 3. Create the Cluster, Load Balancer, and Service if they don't exist
            - name: Provision ECS Infrastructure
              run: |
                aws cloudformation deploy \
                  --template-file ecs-infrastructure.yml \
                  --stack-name my-ecs-environment \
                  --capabilities CAPABILITY_IAM \
                  --parameter-overrides ImageUrl=${{secrets.ECR_REPO}}/my-repo:latest \
                  --no-fail-on-empty-changeset

            # 4. Tell ECS to pull the latest image and restart the containers
            - name: Force New ECS Deployment
              run: |
                aws ecs update-service \
                  --cluster my-ecs-cluster \
                  --service my-ecs-service \
                  --force-new-deployment
                  